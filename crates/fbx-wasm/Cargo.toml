[package]
name = "fbx-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "WebAssembly binary FBX parser backend for lib-fbx"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
indexmap = "2"
miniz_oxide = "0.8"

# 关键性能取舍：这里刻意不用 serde-wasm-bindgen。它会把 Vec<f64> 逐个
# Array::set 造成 O(N) 次 wasm↔js 边界跨越，几十万元素的动画曲线会慢
# 几十倍。lib.rs 里手写 to_js 转换，number 数组直接走 Float64Array::from。

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O3', '--enable-bulk-memory', '--enable-nontrapping-float-to-int', '--enable-mutable-globals', '--enable-sign-ext', '--enable-reference-types']
