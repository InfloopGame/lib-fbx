<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lib-fbx viewer</title>
  </head>
  <body>
    <div id="hud">
      <header>
        <strong>lib-fbx</strong>
        <span>Three.js viewer</span>
      </header>
      <label class="file">
        打开 FBX
        <input id="file" type="file" accept=".fbx,application/octet-stream" />
      </label>
      <label class="check"><input id="wire" type="checkbox" /> 线框</label>
      <label class="check"><input id="skel" type="checkbox" /> 骨骼</label>
      <label class="check"><input id="grid" type="checkbox" checked /> 网格</label>
      <div class="paths" role="radiogroup" aria-label="解析路径">
        <label class="check"><input type="radio" name="path" value="sdk" checked /> SDK</label>
        <label class="check"><input type="radio" name="path" value="parse" /> parse</label>
        <label class="check"><input type="radio" name="path" value="both" /> 对照</label>
      </div>
      <pre id="stat">拖入或选择 .fbx</pre>
      <pre id="diff" hidden></pre>
    </div>
    <aside id="outliner"></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
