name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打包，不提交 npm stage'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Use latest npm (OIDC + stage publish needs >= 11.15.0)
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build

      - name: Check git tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG 与 package.json version $PKG 不一致"
            exit 1
          fi

      - name: Pack
        run: pnpm pack

      # 私有仓库不能生成 provenance；不要给 setup-node 设 registry-url，
      # 否则会写入空 _authToken，挡住 OIDC。
      # bypass-2FA token 即将不能直发；CI 只 stage，维护者 2FA 批准后才上架。
      - name: Stage publish to npm
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          NPM_CONFIG_PROVENANCE: 'false'
        run: npm stage publish --access public
